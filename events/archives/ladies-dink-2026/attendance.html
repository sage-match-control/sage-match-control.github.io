<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ladies' Dink — Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lib/v1/css/attendance-desk.css">
<style>
  /* Same house palette as the event's index.html (its THEME block). Staff
     pages stay light, like the tools. The list itself is styled by the
     ATTENDANCE CLIENT block (.att-*); the --att-* tokens below point it at
     this palette. */
  :root{
    --navy:#26262B;
    --navy-deep:#18181C;
    --green:#E36797;
    --green-dark:#B23A69;
    --paper:#F7F4E6;
    --paper-dim:#EEEAD3;
    --line:#DCD6BC;
    --ink:#232326;
    --ink-soft:#5A5F5E;
    --white:#FFFFFF;
    --red:#B42318;
  }
</style>
<!-- after the page's own styles and the desk's (so the list's default palette wins, as it always has) -->
<link rel="stylesheet" href="/lib/v1/css/attendance.css">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
<link rel="manifest" href="/assets/favicons/site.webmanifest">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="kicker">S.A.G.E. Match Control Experts</div>
    <h1>Attendance</h1>
    <div class="event">Ladies' Dink<span id="dayLabel"></span></div>
  </div>
</header>
<main class="wrap">
  <p class="desk-message" id="deskMessage" role="status"></p>
  <div id="deskRoot"></div>
</main>

<script type="module">
// ============================================================================
// SETTINGS — the only script in this page. The desk page itself is lib/v1/apps/attendance-desk.js.
// ============================================================================
import { mountAttendanceDesk } from '/lib/v1/apps/attendance-desk.js';

const EVENT_KEY = 'ladies-dink-2026';
// The live Worker's address, for the nudges that say another device marked someone. A literal, the same as
// Control Center's, not a token. '' turns it off: the page then says live updates are off.
const LIVE_BASE_URL = '';

mountAttendanceDesk({ eventKey: EVENT_KEY, liveBaseUrl: LIVE_BASE_URL });
</script>
</body>
</html>
