<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{EVENT_TITLE}} — Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Same house palette as the event's index.html (its THEME block). Staff
     pages stay light, like the tools. The list itself is styled by the
     ATTENDANCE CLIENT block (.att-*); the --att-* tokens below point it at
     this palette. */
  :root{
    --navy:#14263C;
    --navy-deep:#0B1826;
    --green:#7CB92C;
    --green-dark:#5C8F1F;
    --paper:#F6F7F2;
    --paper-dim:#ECEEE6;
    --line:#D9DED2;
    --ink:#14263C;
    --ink-soft:#5B6B74;
    --white:#FFFFFF;
    --red:#B42318;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px;}

  header.top{
    background:var(--navy);
    color:var(--white);
    padding:16px 0 14px;
  }
  .kicker{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#A8D65C;
  }
  h1{
    font-family:'Archivo Black',sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:26px;
    margin:2px 0 4px;
  }
  .event{font-size:14px;color:#D6DCE8;overflow-wrap:anywhere;}

  main{padding-top:14px;padding-bottom:20px;}
  .desk-message{
    margin:40px 0;
    text-align:center;
    color:var(--ink-soft);
    font-size:17px;
  }
  .desk-message:empty{display:none;}

  /* The block's colours, mapped to this palette. Green is a fill, so the text
     on it is navy (see the THEME contrast note in index.html). */
  .att-root{
    --att-navy:var(--navy);
    --att-green:var(--green);
    --att-green-dark:var(--green-dark);
    --att-paper:var(--paper);
    --att-dim:var(--paper-dim);
    --att-line:var(--line);
    --att-ink:var(--ink);
    --att-soft:var(--ink-soft);
    --att-red:var(--red);
  }
  .att-badge,.att-bar button{color:var(--navy);}
</style>
<!-- after the page's styles, where the stylesheet this replaces was injected -->
<link rel="stylesheet" href="/lib/v1/css/attendance.css">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
<link rel="manifest" href="/assets/favicons/site.webmanifest">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="kicker">S.A.G.E. Match Control Experts</div>
    <h1>Attendance</h1>
    <div class="event">{{EVENT_TITLE}}<span id="dayLabel"></span></div>
  </div>
</header>
<main class="wrap">
  <p class="desk-message" id="deskMessage" role="status"></p>
  <div id="deskRoot"></div>
</main>

<script type="module">
// The engine (lib/v1): the ATTENDANCE tab's parsing and grouping, as a module.
import { attParseCsv, defaultCategoryLabel } from '/lib/v1/domain/attendance.js';

// The engine's data layer: constants, the registry, the snapshot, link tokens.
import { CLOUD_RUN_BASE_URL, ATTENDANCE_POLL_MS, fixtureName } from '/lib/v1/platform.js';
import { loadRegistry } from '/lib/v1/data/registry.js';
import { fetchDaySnapshotFromPages } from '/lib/v1/data/snapshot.js';
import { deskDecode, deskLoadToken, deskStorageKey } from '/lib/v1/data/tokens.js';
import { createAttendanceView } from '/lib/v1/views/attendance-view.js';

// ============================================================================
// THE DESK PAGE
// Staff check-in with a desk link: one link per event day, scoped to marking
// attendance and nothing else, expiring at the end of that day. Linked from
// nowhere public. See sage-docs/docs/specs/.../multi-event-attendance-spec.md §6.4.
// ============================================================================
const EVENT_KEY = '{{EVENT_KEY}}';
// Local testing only: on localhost, ?fixture=<name> reads /_fixtures/ instead of the published data and
// marks in memory (lib/v1/platform.js). Inert on the live site.
const FIXTURE = fixtureName();
const DESK_STORAGE_KEY = deskStorageKey(EVENT_KEY);

const deskMessageEl = document.getElementById('deskMessage');
const deskRootEl = document.getElementById('deskRoot');
function deskSay(text){ deskMessageEl.textContent = text; }

async function deskStart(){
  const token = deskLoadToken(EVENT_KEY);
  const info = token ? deskDecode(token) : null;
  if(!info || Date.now() >= info.exp){
    deskSay('Ask the operator for a desk link.');
    return;
  }

  let entry;
  try{
    const config = await loadRegistry({ fixture: FIXTURE });
    entry = config.events && config.events[EVENT_KEY];
  }catch(err){
    deskSay(`Could not load this event (${err.message.replace(/^HTTP (\d+)$/, 'replied $1')}). Check this device's connection and reload.`);
    return;
  }
  if(!entry || entry.attendance !== 'desks'){
    deskSay('Check-in for this event is handled by staff.');
    return;
  }
  const dayEntry = entry.days && entry.days[info.day];
  if(!dayEntry){
    deskSay('This desk link does not match a day of this event. Ask the operator for a new one.');
    return;
  }
  document.getElementById('dayLabel').textContent = ` · ${dayEntry.label || info.day}`;

  // Team events name their teams in the published standings (teamCode,teamName,…).
  // Read once; if it cannot be read the page shows "Team <code>" instead.
  const teamNames = {};
  if(entry.type === 'team'){
    try{
      const snapshot = await fetchDaySnapshotFromPages(EVENT_KEY, info.day, { fixture: FIXTURE });
      (snapshot.facilities || []).forEach(f => {
        const rows = attParseCsv(f.standingsCsv || '');
        const head = (rows[0] || []).map(h => h.trim());
        const iCode = head.indexOf('teamCode'), iName = head.indexOf('teamName');
        if(iCode === -1 || iName === -1) return;
        rows.slice(1).forEach(r => { if(r[iCode] && r[iName] && r[iName].trim()) teamNames[r[iCode].trim()] = r[iName].trim(); });
      });
    }catch(err){ /* team codes stand in for names */ }
  }

  createAttendanceView({
    root: deskRootEl,
    mode: 'desk',
    apiBase: CLOUD_RUN_BASE_URL,
    pollMs: ATTENDANCE_POLL_MS,
    getToken: () => token,
    event: EVENT_KEY,
    day: info.day,
    facilities: dayEntry.facilities || [],
    type: entry.type,
    teamName: code => teamNames[code] || null,
    categoryLabel: code => defaultCategoryLabel(code, entry.display || {}),
    fixture: FIXTURE,
  });
}

deskStart();
</script>
</body>
</html>
