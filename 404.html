<!DOCTYPE html>

<title>Page not found · S.A.G.E.</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet" />
<style>
  :root { --navy:#14263C; --green:#7CB92C; --white:#FFFFFF; --line:#D9DED2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--navy); color: var(--white); font: 400 16px/1.5 Inter, system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 32px 16px; text-align: center; }
  .logo { width: 88px; height: 88px; padding: 4px; background: var(--white); border-radius: 14px; display: block; }
  .court { width: 100%; max-width: 360px; height: auto; margin: 28px 0 0; display: block; }
  .code { margin: 24px 0 4px; color: var(--green); font: 600 15px 'Barlow Condensed', system-ui, sans-serif; letter-spacing: .22em; }
  h1 { margin: 0; font: 400 clamp(30px, 8vw, 46px)/1.1 'Archivo Black', system-ui, sans-serif; text-transform: uppercase; overflow-wrap: anywhere; text-wrap: balance; }
  .message { margin: 12px 0 0; max-width: 34ch; color: var(--line); text-wrap: balance; }
</style>
</head>

<!-- GitHub Pages serves this for every missing address. -->
<main>
  <img class="logo" src="/assets/logo.png" alt="S.A.G.E. Match Control Experts" />

    </g>
    <path d="M 60 80 Q 150 -18 243 54" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 5" />
    <circle cx="250" cy="60" r="10" fill="#7CB92C" />

      <circle cx="246.5" cy="56.5" r="1.4" /><circle cx="253" cy="55.5" r="1.4" /><circle cx="250" cy="60.5" r="1.4" />
      <circle cx="245.5" cy="63" r="1.4" /><circle cx="254.5" cy="62" r="1.4" /><circle cx="250" cy="66" r="1.4" />

  <h1>That one landed out</h1>

</html>
